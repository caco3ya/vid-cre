<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111c38"><title>Tutor Mohan Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Instrument+Sans:wght@500;600;700&display=swap">
<style>
:root{--ac:#f5a524;--onac:#101828}
[data-theme=dark]{--bg:#0a1226;--s1:#111c38;--s2:#1a2850;--ln:#27386a;--tx:#eaf0ff;--mu:#8d9cc6;--stage:#070d1d}
[data-theme=light]{--bg:#eceff6;--s1:#fff;--s2:#f2f4fa;--ln:#dce1ee;--tx:#0d1b3e;--mu:#68739a;--stage:#dfe4f0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:500 14px/1.35 "Instrument Sans",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{flex:none;height:58px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--s1);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--ac)}
.brand b{display:block;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.brand small{color:var(--mu);font-size:11.5px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--ln)}
.ib:hover{border-color:var(--ac)}
.rec{height:40px;padding:0 16px;border-radius:20px;background:var(--ac);color:var(--onac);font-weight:700;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.rec{position:relative;overflow:hidden}.rec::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:calc(var(--lv,0)*100%);background:#fff;opacity:.9}
.rec i{width:11px;height:11px;border-radius:50%;background:#e11d48}
.rec.on{background:#e11d48;color:#fff}.rec.on i{background:#fff;animation:p 1.2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #fff9}100%{box-shadow:0 0 0 9px #fff0}}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.center{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.stagewrap{flex:1;min-height:0;display:grid;place-items:center;background:var(--stage);overflow:hidden;position:relative;touch-action:none}
#stage{transform-origin:50% 50%;will-change:transform}
.zoombar{position:absolute;top:10px;right:10px;z-index:6;display:flex;align-items:center;gap:4px;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);box-shadow:0 6px 20px #0005}
.zl{min-width:54px;height:34px;border-radius:10px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.zl:hover{color:var(--ac)}
#stage{position:relative;overflow:hidden;border-radius:10px;background:#fff;box-shadow:0 26px 70px #0008,0 0 0 1px #ffffff1a}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ta{position:absolute;z-index:5;background:transparent;border:0;outline:2px dashed var(--ac);padding:0;resize:none;line-height:1.25;font-weight:600;overflow:hidden;white-space:pre;user-select:text;-webkit-user-select:text}
#wm{position:absolute;aspect-ratio:1;object-fit:cover;pointer-events:none;box-shadow:0 2px 12px #0003}
#cam{position:absolute;z-index:4;overflow:hidden;background:#000;border:3px solid #fff;box-shadow:0 8px 24px #0006;touch-action:none;cursor:grab}
#vid{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
#rz{position:absolute;right:5px;bottom:5px;width:28px;height:28px;border-radius:50%;background:#000a;color:#fff;touch-action:none;cursor:nwse-resize;font-size:13px}
.quick{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--s1);border-top:1px solid var(--ln);overflow-x:auto;scrollbar-width:none}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--s1);box-shadow:0 0 0 1px var(--ln)}
.sw.on{box-shadow:0 0 0 3px var(--ac)}
.add{position:relative;display:grid;place-items:center;background:var(--s2);font-weight:700;color:var(--mu);cursor:pointer}
.add input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sp{flex:1;min-width:6px}.quick input[type=range]{width:120px;flex:none}
.dot{flex:none;display:block;border-radius:50%;margin:0 4px}
input[type=range]{accent-color:var(--ac);width:100%}
.rail{order:2;flex:none;display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:var(--s1);border-top:1px solid var(--ln);scrollbar-width:none}
.tb{flex:none;width:52px;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--s2);border:1px solid var(--ln);font-size:10.5px;font-weight:600;color:var(--mu)}
.tb:disabled{opacity:.35}.tb.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}.tb.warn{border-color:#e11d48;color:#fb7185}
.sepv{flex:none;width:1px;background:var(--ln);margin:4px 2px}
.panel{position:fixed;left:0;right:0;bottom:0;max-height:66dvh;z-index:30;display:flex;flex-direction:column;overflow-y:auto;background:var(--s1);border-radius:22px 22px 0 0;box-shadow:0 -20px 60px #0009;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.panel.open{transform:none}
.grab{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0 18px}
.tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;padding:10px 12px;background:var(--s1)}
.tab{flex:1;padding:9px 0;border-radius:10px;font-weight:600;color:var(--mu)}
.tab.on{background:var(--s2);color:var(--tx);box-shadow:inset 0 -2px var(--ac)}
.sec{display:grid;gap:16px;padding:6px 16px 22px}
.row>label{display:block;margin-bottom:7px;color:var(--mu);font-size:12.5px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:10px;background:var(--s2);border:1px solid var(--ln);font-weight:600;font-size:13px}
.seg .on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.seg .c{width:34px;height:34px;padding:0;border-radius:50%}
input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font:inherit;user-select:text;-webkit-user-select:text}
input[type=color]{width:100%;height:40px;border:1px solid var(--ln);border-radius:10px;background:var(--s2);padding:3px}
.tgl{display:flex;align-items:center;justify-content:space-between;width:100%;padding:4px 0;font-weight:600}
.tgl i{width:44px;height:26px;border-radius:13px;background:var(--ln);position:relative;transition:background .2s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl[aria-checked=true] i{background:var(--ac)}.tgl[aria-checked=true] i::after{transform:translateX(18px)}
.act{padding:11px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);font-weight:600;text-align:center;cursor:pointer;display:block}
.act:hover{border-color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:50;background:#0d1b3e;color:#fff;border:1px solid var(--ac);padding:10px 16px;border-radius:12px;max-width:88vw;text-align:center;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pages{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--s1);border-top:1px solid var(--ln)}
.chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;min-width:34px;height:34px;padding:0 9px;border-radius:10px;background:var(--s2);border:1px solid var(--ln);font-weight:600;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}.chip.doc:not(.on){box-shadow:inset 0 -3px var(--ac)}
.ib.sm{flex:none;width:34px;height:34px;border-radius:10px;font-size:20px;cursor:pointer}
#wrap.drop{outline:3px dashed var(--ac);outline-offset:-10px}
@media(min-width:900px){
 main{flex-direction:row}
 .rail{order:0;flex-direction:column;width:76px;padding:12px 11px;border-top:0;border-right:1px solid var(--ln);overflow-y:auto;overflow-x:hidden}
 .sepv{width:auto;height:1px;margin:2px 4px}
 .panel{position:static;transform:none;width:332px;max-height:none;border-radius:0;box-shadow:none;border-left:1px solid var(--ln);flex:none}
 .grab,#cfg{display:none}
 #toast{bottom:90px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="app">
<header>
 <div class="brand"><img id="logo" alt=""><div><b id="nm"></b><small>Whiteboard studio</small></div></div>
 <button class="ib" id="cfg" aria-label="Customise"></button>
 <button class="rec" id="recb"><i></i><span>Record</span></button>
</header>
<main>
 <nav class="rail" id="rail" aria-label="Tools"></nav>
 <section class="center">
  <div class="stagewrap" id="wrap"><div id="stage">
   <canvas id="board"></canvas><textarea id="ta" hidden wrap="off" spellcheck="false"></textarea>
   <img id="wm" alt="">
   <div id="cam" hidden><video id="vid" muted playsinline autoplay></video><button id="rz" aria-label="Resize camera">&#8600;</button></div>
  </div>
  <div class="zoombar" role="group" aria-label="Zoom"><button class="ib sm" id="zout" aria-label="Zoom out" title="Zoom out (-)">&#8722;</button><button class="zl" id="zl" aria-label="Reset zoom" title="Reset to fit (0)">100%</button><button class="ib sm" id="zin" aria-label="Zoom in" title="Zoom in (+)">+</button></div></div>
  <div class="pages"><button class="ib sm" id="pprev" aria-label="Previous page">&#8249;</button><div class="chips" id="pgs"></div><button class="ib sm" id="pnext" aria-label="Next page">&#8250;</button><label class="ib sm" id="ins" title="Insert PDF or image"><input type="file" id="fin" accept="image/*,application/pdf" multiple hidden></label><button class="ib sm" id="pdel" aria-label="Delete page"></button></div>
  <div class="quick" id="quick"></div>
 </section>
 <aside class="panel" id="panel"></aside>
</main></div>
<div id="toast" role="status"></div>
